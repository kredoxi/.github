name: Feature or design proposal
description: Propose a scoped requirement or architectural improvement.
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach and alternatives
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security boundaries and limitations
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Reproducible acceptance criteria
    validations:
      required: true
