name: Governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate community and CI configuration
        run: |
          python scripts/validate_governance.py
          python -m unittest discover -s scripts -p "test_*.py"
      - name: Install pinned cARL
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/carl_1.0.2_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/goldjg/cARL/releases/download/v1.0.2/carl_1.0.2_linux_amd64.tar.gz \
            --output "$archive"
          echo "d56eee02d6e008c42feb6b5a97ac86ea94599a0440d596bd3be015112d01c264  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/carl-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/carl-bin" carl
          echo "$RUNNER_TEMP/carl-bin" >> "$GITHUB_PATH"
      - name: Validate effective cARL governance
        run: python scripts/validate_governance.py --carl carl
